name: Publish to npm

on:
  push:
    tags:
      - 'v*'            # 与仓库现有 v0.8.x tag 约定一致
  workflow_dispatch:    # 允许手动触发

# OIDC 发布 provenance 必须拿到 id-token
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24   # tsdown 0.23 构建工具用到 Node 22+ 的 Promise.withResolvers
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run build   # 确保 lib/ 产物与源码一致

      # npm publish 默认即把版本打上 latest；OIDC 自动鉴权只覆盖 publish 本身，
      # 单独的 npm dist-tag 会回退读 .npmrc token 而 401，故不在此显式 dist-tag。
      - run: npm publish --provenance --access public
